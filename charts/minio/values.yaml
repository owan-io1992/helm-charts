# Default values for minio.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- String to partially override `minio.fullname` template.
nameOverride: ""
# -- String to fully override `minio.fullname` template.
fullnameOverride: ""

# -- Service account configuration.
# ref: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created.
  create: false
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

minio:
  # -- MinIO container image configuration.
  # ref: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # -- MinIO image repository.
    repository: cleanstart/minio
    # -- MinIO image pull policy.
    pullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # -- Secrets for pulling an image from a private repository.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  # -- MinIO root user for initial setup.
  minio_root_user: "minioadmin"
  # -- MinIO root password for initial setup.
  minio_root_password: "minioadmin"
  # -- MinIO server region name.
  minio_region_name: "us-east-1"
  # -- List of buckets to auto-create on startup.
  buckets: []
  # - bucket1
  # - bucket2

  # -- Persistent storage configuration.
  persistentStorage:
    # -- Persistent volume access modes.
    accessModes: ["ReadWriteOnce"]
    # -- Storage class name for persistent volume.
    storageClassName: ""
    # -- Size of the persistent volume.
    size: "5Gi"

  # -- Liveness and readiness probes configuration.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /minio/health/live
      port: s3api
    initialDelaySeconds: 30
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /minio/health/ready
      port: s3api
    initialDelaySeconds: 0
    periodSeconds: 10

  # -- Node labels for pod assignment.
  # ref: https://kubernetes.io/docs/user-guide/node-selection/
  nodeSelector: {}

  # -- Tolerations for pod scheduling.
  # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  tolerations: []

  # -- Affinity for pod scheduling.
  # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- Arguments to pass to the MinIO server.
  args: ["server", "/data", "--console-address", ":9001"]

  # -- Annotations to add to the pod.
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # -- Labels to add to the pod.
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  # -- Security context for the pod.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    fsGroup: 1000

  # -- Security context for the container.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # -- Service configuration.
  # ref: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    s3api:
      # -- S3 API service type.
      type: ClusterIP
      # -- S3 API service port.
      port: 9000
    # -- use georgmangold/console instead
    # console:
    #   type: ClusterIP
    #   port: 9001

  # -- Resource requests and limits for the MinIO container.
  # ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi

# -- MinIO Console configuration.
# ref: https://github.com/georgmangold/console
console:
  # -- MinIO Console container image configuration.
  # ref: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # -- MinIO Console image repository.
    repository: ghcr.io/georgmangold/console
    # -- MinIO Console image pull policy.
    pullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion.
    tag: "v1.8.1"

  service:
    # -- MinIO Console service type.
    type: ClusterIP
    # -- MinIO Console service port.
    port: 9090

  # -- Environment variables for the MinIO Console.
  # ref: https://github.com/georgmangold/console/blob/main/docs/Environment.md
  env:
    - name: "CONSOLE_MINIO_SERVER"
      value: http://{{ include "minio.fullname" . }}-s3api:{{ .Values.minio.service.s3api.port }}
    - name: "CONSOLE_MINIO_REGION"
      value: "us-east-1"

  # -- Secrets for pulling an image from a private repository.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  # -- Node labels for pod assignment.
  # ref: https://kubernetes.io/docs/user-guide/node-selection/
  nodeSelector: {}

  # -- Tolerations for pod scheduling.
  # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  tolerations: []

  # -- Affinity for pod scheduling.
  # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- Number of replicas for the MinIO Console deployment.
  # ref: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # -- Annotations to add to the pod.
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # -- Labels to add to the pod.
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  # -- Security context for the pod.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext: {}

  # -- Security context for the container.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  securityContext: {}

  # -- Resource requests and limits for the MinIO Console container.
  # ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 50m
    #   memory: 64Mi
